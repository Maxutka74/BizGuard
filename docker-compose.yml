services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bizguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bizguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bizguard
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      GEMINI_ENABLED: "False"
      AI_PROVIDER_ORDER: ${AI_PROVIDER_ORDER:-ollama}
      AI_MESSAGE_TIME_BUDGET_SECONDS: ${AI_MESSAGE_TIME_BUDGET_SECONDS:-30}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      OLLAMA_PULL_ON_START: ${OLLAMA_PULL_ON_START:-true}
      OLLAMA_MODEL_CHECK_SECONDS: ${OLLAMA_MODEL_CHECK_SECONDS:-60}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-2048}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-480}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      PURCHASE_SITE_URL: ${PURCHASE_SITE_URL:-http://localhost:5174}
      BIZGUARD_APP_URL: ${BIZGUARD_APP_URL:-http://localhost:5173}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:5173/auth/callback}
      GOOGLE_PUBLIC_OAUTH_REDIRECT_URI: ${GOOGLE_PUBLIC_OAUTH_REDIRECT_URI:-http://localhost:8000/api/accounts/google/public-redirect}
      GMAIL_OAUTH_REDIRECT_URI: ${GMAIL_OAUTH_REDIRECT_URI:-http://localhost:8000/api/gmail/auth/callback/}
      BILLING_FAKE_MODE: ${BILLING_FAKE_MODE:-False}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: ./backend
    command: celery -A config worker --loglevel=info --queues=celery --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
    volumes:
      - ./backend:/app
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bizguard
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      GEMINI_ENABLED: "False"
      AI_PROVIDER_ORDER: ${AI_PROVIDER_ORDER:-ollama}
      AI_MESSAGE_TIME_BUDGET_SECONDS: ${AI_MESSAGE_TIME_BUDGET_SECONDS:-30}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      OLLAMA_PULL_ON_START: ${OLLAMA_PULL_ON_START:-true}
      OLLAMA_MODEL_CHECK_SECONDS: ${OLLAMA_MODEL_CHECK_SECONDS:-60}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-2048}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-480}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      PURCHASE_SITE_URL: ${PURCHASE_SITE_URL:-http://localhost:5174}
      BIZGUARD_APP_URL: ${BIZGUARD_APP_URL:-http://localhost:5173}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:5173/auth/callback}
      GOOGLE_PUBLIC_OAUTH_REDIRECT_URI: ${GOOGLE_PUBLIC_OAUTH_REDIRECT_URI:-http://localhost:8000/api/accounts/google/public-redirect}
      GMAIL_OAUTH_REDIRECT_URI: ${GMAIL_OAUTH_REDIRECT_URI:-http://localhost:8000/api/gmail/auth/callback/}
      BILLING_FAKE_MODE: ${BILLING_FAKE_MODE:-False}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: ./backend
    command: celery -A config beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bizguard
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      GEMINI_ENABLED: "False"
      AI_PROVIDER_ORDER: ${AI_PROVIDER_ORDER:-ollama}
      AI_MESSAGE_TIME_BUDGET_SECONDS: ${AI_MESSAGE_TIME_BUDGET_SECONDS:-30}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      OLLAMA_PULL_ON_START: ${OLLAMA_PULL_ON_START:-true}
      OLLAMA_MODEL_CHECK_SECONDS: ${OLLAMA_MODEL_CHECK_SECONDS:-60}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-2048}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-480}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      PURCHASE_SITE_URL: ${PURCHASE_SITE_URL:-http://localhost:5174}
      BIZGUARD_APP_URL: ${BIZGUARD_APP_URL:-http://localhost:5173}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:5173/auth/callback}
      GOOGLE_PUBLIC_OAUTH_REDIRECT_URI: ${GOOGLE_PUBLIC_OAUTH_REDIRECT_URI:-http://localhost:8000/api/accounts/google/public-redirect}
      GMAIL_OAUTH_REDIRECT_URI: ${GMAIL_OAUTH_REDIRECT_URI:-http://localhost:8000/api/gmail/auth/callback/}
      BILLING_FAKE_MODE: ${BILLING_FAKE_MODE:-False}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_ai_worker:
    build: ./backend
    command: celery -A config worker --loglevel=info --queues=ai --concurrency=${CELERY_AI_WORKER_CONCURRENCY:-2} --prefetch-multiplier=1
    volumes:
      - ./backend:/app
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bizguard
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      GEMINI_ENABLED: "False"
      AI_PROVIDER_ORDER: ${AI_PROVIDER_ORDER:-ollama}
      AI_MESSAGE_TIME_BUDGET_SECONDS: ${AI_MESSAGE_TIME_BUDGET_SECONDS:-30}
      AI_QUEUE_MAX_BATCH: ${AI_QUEUE_MAX_BATCH:-30}
      AI_QUEUE_MAX_PARALLEL_PER_ACCOUNT: ${AI_QUEUE_MAX_PARALLEL_PER_ACCOUNT:-2}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      OLLAMA_DISABLE_ON_ERROR_SECONDS: ${OLLAMA_DISABLE_ON_ERROR_SECONDS:-30}
      OLLAMA_MODEL_CHECK_SECONDS: ${OLLAMA_MODEL_CHECK_SECONDS:-60}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-2048}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-480}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      PURCHASE_SITE_URL: ${PURCHASE_SITE_URL:-http://localhost:5174}
      BIZGUARD_APP_URL: ${BIZGUARD_APP_URL:-http://localhost:5173}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:5173/auth/callback}
      GOOGLE_PUBLIC_OAUTH_REDIRECT_URI: ${GOOGLE_PUBLIC_OAUTH_REDIRECT_URI:-http://localhost:8000/api/accounts/google/public-redirect}
      GMAIL_OAUTH_REDIRECT_URI: ${GMAIL_OAUTH_REDIRECT_URI:-http://localhost:8000/api/gmail/auth/callback/}
      BILLING_FAKE_MODE: ${BILLING_FAKE_MODE:-False}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    ports:
      - "11434:11434"
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama_pull:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    command: pull ${OLLAMA_MODEL:-qwen2.5:1.5b}
    depends_on:
      ollama:
        condition: service_healthy

  bizguard_app:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "if [ ! -d node_modules/vite ]; then npm ci; fi; npm run dev -- --host 0.0.0.0"
    volumes:
      - ./apps/bizguard-app:/app
      - bizguard_app_node_modules:/app/node_modules
    ports:
      - "${BIZGUARD_APP_HOST_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-8000}
      VITE_API_TARGET: http://backend:8000
    depends_on:
      - backend

  purchase_site:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "if [ ! -d node_modules/vite ]; then npm ci; fi; npm run dev -- --host 0.0.0.0"
    volumes:
      - ./apps/purchase-site:/app
      - purchase_site_node_modules:/app/node_modules
    ports:
      - "${PURCHASE_SITE_HOST_PORT:-5174}:5174"
    environment:
      VITE_BIZGUARD_APP_URL: http://localhost:5173
      VITE_API_TARGET: http://backend:8000
    depends_on:
      - backend
volumes:
  postgres_data:
  redis_data:
  ollama_data:
  bizguard_app_node_modules:
  purchase_site_node_modules:
